[build]
builder = "RAILPACK"
buildCommand = "npx prisma generate && npm run build"

[deploy]
preDeployCommand = "npx prisma migrate deploy && npm run production:activate && npm run production:purge-demo"
startCommand = "HOSTNAME=0.0.0.0 npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"

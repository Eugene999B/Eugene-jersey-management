name: Apply Governance Isolation Guard

on:
  push:
    branches:
      - work/roadmap-ceo-settings-governance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/roadmap-ceo-settings-governance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard platform governance from tenant clients
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tenant = Path("src/lib/tenant-db.ts")
          text = tenant.read_text()
          anchor = '  accountTwoFactor: "AccountTwoFactor",\n'
          addition = anchor + '  platformGovernanceSettings: "PlatformGovernanceSettings",\n'
          if 'platformGovernanceSettings: "PlatformGovernanceSettings"' not in text:
              if anchor not in text:
                  raise SystemExit("tenant-db anchor missing")
              text = text.replace(anchor, addition, 1)
          tenant.write_text(text)

          verify = Path("scripts/verify-tenant-isolation.ts")
          text = verify.read_text()
          anchor = '''    await expectRejects(
              TenantDatabaseAccessError,
              () => tenantA.$transaction(async (transaction) => transaction.accountTwoFactor.findMany()),
              "Interactive transaction accessed platform-global two-factor records.",
            );
          '''
          addition = anchor + '''
            await expectRejects(
              TenantDatabaseAccessError,
              () => tenantA.platformGovernanceSettings.findMany(),
              "Tenant client accessed platform governance settings.",
            );

            await expectRejects(
              TenantDatabaseAccessError,
              () => tenantA.$transaction(async (transaction) => transaction.platformGovernanceSettings.findMany()),
              "Interactive transaction accessed platform governance settings.",
            );
          '''
          if "Tenant client accessed platform governance settings." not in text:
              if anchor not in text:
                  raise SystemExit("isolation test anchor missing")
              text = text.replace(anchor, addition, 1)
          text = text.replace(
              "design-version denial, two-factor global-model denial, and raw SQL denial.",
              "design-version denial, platform-governance denial, two-factor global-model denial, and raw SQL denial.",
          )
          verify.write_text(text)
          PY
          rm -f .github/workflows/apply-governance-isolation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tenant-db.ts scripts/verify-tenant-isolation.ts .github/workflows/apply-governance-isolation.yml
          git commit -m "Deny platform governance through tenant clients"
          git push origin HEAD:work/roadmap-ceo-settings-governance

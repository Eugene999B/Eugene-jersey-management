name: Fix Phase 2 TypeScript

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-phase2-typescript.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'phase-2/modular-system-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-2/modular-system-architecture

      - name: Apply focused type corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          auth = Path('src/lib/auth.ts')
          auth_text = auth.read_text()
          old_auth = '      planTier: true,\n      isActive: true,'
          new_auth = '      planTier: true,\n      enabledModules: true,\n      isActive: true,'
          if auth_text.count(old_auth) != 1:
              raise SystemExit(f'Unexpected auth selector match count: {auth_text.count(old_auth)}')
          auth.write_text(auth_text.replace(old_auth, new_auth))

          network = Path('src/app/dashboard/network/actions.ts')
          network_text = network.read_text()
          old_network = '  const shopId = session.shopId;\n  await requireBusinessModuleAccess(shopId, "MARKETPLACE");\n  if (!shopId) redirect("/login");'
          new_network = '  const shopId = session.shopId;\n  if (!shopId) redirect("/login");\n  await requireBusinessModuleAccess(shopId, "MARKETPLACE");'
          if network_text.count(old_network) != 1:
              raise SystemExit(f'Unexpected network guard match count: {network_text.count(old_network)}')
          network.write_text(network_text.replace(old_network, new_network))
          PY
          git diff --check
          git diff -- src/lib/auth.ts src/app/dashboard/network/actions.ts

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/auth.ts src/app/dashboard/network/actions.ts
          git config user.name "Eugene Shop Release Bot"
          git config user.email "194670606+Eugene999B@users.noreply.github.com"
          git commit -m "fix: include module configuration in tenant context"
          git push origin HEAD:phase-2/modular-system-architecture

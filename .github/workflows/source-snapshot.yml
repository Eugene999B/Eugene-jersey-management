name: Source snapshot

on:
  push:
    branches:
      - automation/phase-1-source-snapshot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: eugene-shop-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

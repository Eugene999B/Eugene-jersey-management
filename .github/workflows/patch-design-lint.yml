name: Patch Design Studio lint diagnostics

on:
  push:
    branches:
      - agent/fix-login-csp-and-design-production
    paths:
      - .github/workflows/patch-design-lint.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-login-csp-and-design-production
      - name: Apply reviewed lint fixes
        shell: python
        run: |
          from pathlib import Path

          component = Path("src/components/design/production-studio.tsx")
          text = component.read_text(encoding="utf-8")
          text = text.replace(
            '  useId,\n  useMemo,\n  useRef,\n',
            '  useId,\n  useRef,\n',
            1,
          )
          old = '''  const productionCheck = useMemo(() => checkProductionDesign({
              layers,
              sheet: size,
              machineProfile,
              material,
              mirror,
              registrationMarks,
              copies,
            }), [layers, size.width, size.height, machineProfile, material, mirror, registrationMarks, copies]);
          '''
          new = '''  const productionCheck = checkProductionDesign({
              layers,
              sheet: size,
              machineProfile,
              material,
              mirror,
              registrationMarks,
              copies,
            });
          '''
          if old not in text:
            raise SystemExit("Production-check memo block not found")
          text = text.replace(old, new, 1)
          old = '''              {layers.map((layer) => layer.visible ? (
                            <g
          '''
          new = '''              {layers.map((layer) => layer.visible ? (
                            /* biome-ignore lint/a11y/useSemanticElements: An interactive SVG group cannot be replaced by an HTML button inside the SVG coordinate canvas. */
                            <g
          '''
          if old not in text:
            raise SystemExit("SVG layer group anchor not found")
          text = text.replace(old, new, 1)
          component.write_text(text, encoding="utf-8")

          helper = Path("src/lib/design-production.ts")
          helper_text = helper.read_text(encoding="utf-8")
          if '<\\/script>' not in helper_text:
            raise SystemExit("Escaped script close not found")
          helper.write_text(helper_text.replace('<\\/script>', '</script>', 1), encoding="utf-8")
      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/design/production-studio.tsx src/lib/design-production.ts
          git commit -m "Resolve Design Studio lint diagnostics"
          git push origin HEAD:agent/fix-login-csp-and-design-production

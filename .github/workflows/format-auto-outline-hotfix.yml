name: Finalize automatic outline hotfix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/hotfix-auto-outline-text'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotfix-auto-outline-text
          fetch-depth: 0
      - name: Fix final source formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/design/production-studio-advanced.tsx")
          source = path.read_text()
          old = '''    const paths = await prepareCutPaths();
            if (!paths) return;
              const writer = port.writable.getWriter();'''
          new = '''    const paths = await prepareCutPaths();
              if (!paths) return;
              const writer = port.writable.getWriter();'''
          if old not in source:
              raise SystemExit("direct cutter formatting marker did not match")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Remove one-time finalizer
        run: git rm .github/workflows/format-auto-outline-hotfix.yml
      - name: Commit final source
        run: |
          git config user.name "EJM Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/design/production-studio-advanced.tsx
          git commit -m "fix: finalize automatic text outline source"
          git push origin HEAD:agent/hotfix-auto-outline-text

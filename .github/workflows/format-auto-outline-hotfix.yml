name: Format automatic outline hotfix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/hotfix-auto-outline-text'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotfix-auto-outline-text
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format hotfix files
        run: npx --no-install biome format --write src/lib/design-text-outline.ts src/lib/design-cut-path.ts src/lib/design-production.ts src/components/design/production-studio-advanced.tsx src/tests/design-text-outline.test.ts src/tests/design-cut-path.test.ts
      - name: Remove one-time formatter
        run: git rm .github/workflows/format-auto-outline-hotfix.yml
      - name: Commit formatting
        run: |
          git config user.name "EJM Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/design-text-outline.ts src/lib/design-cut-path.ts src/lib/design-production.ts src/components/design/production-studio-advanced.tsx src/tests/design-text-outline.test.ts src/tests/design-cut-path.test.ts
          git commit -m "style: format automatic cutter text outlines"
          git push origin HEAD:agent/hotfix-auto-outline-text

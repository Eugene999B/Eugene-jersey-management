name: Phase 4 source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current repository source
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-current-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

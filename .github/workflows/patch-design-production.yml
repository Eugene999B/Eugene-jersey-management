name: Patch Design Studio production workflow

on:
  push:
    branches:
      - agent/fix-login-csp-and-design-production
    paths:
      - .github/workflows/patch-design-production.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-login-csp-and-design-production
      - name: Apply production-safe Design Studio changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/design/production-studio.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
            (
              '  Save,\n  Scissors,\n',
              '  Save,\n  Scissors,\n  Send,\n',
            ),
            (
              'import { Button } from "@/components/ui/button";\n',
              'import { Button } from "@/components/ui/button";\nimport { buildHpgl, buildPrintDocument, checkProductionDesign, clampLayerToSheet, type ProductionMachineProfile } from "@/lib/design-production";\n',
            ),
            (
              'type MachineProfile = "Generic SVG" | "SignMaster" | "VinylMaster" | "Print/RIP";\n',
              'type MachineProfile = ProductionMachineProfile;\n',
            ),
            (
              'type SerialPortLike = {\n  open(options: { baudRate: number }): Promise<void>;\n  close(): Promise<void>;\n  getInfo?: () => { usbVendorId?: number; usbProductId?: number };\n};\n',
              'type SerialPortLike = {\n  open(options: { baudRate: number }): Promise<void>;\n  close(): Promise<void>;\n  writable: WritableStream<Uint8Array> | null;\n  getInfo?: () => { usbVendorId?: number; usbProductId?: number };\n};\n',
            ),
            (
              '  URL.revokeObjectURL(anchor.href);\n',
              '  window.setTimeout(() => URL.revokeObjectURL(anchor.href), 1_000);\n',
            ),
            (
              '  function updateLayer(layerId: string, changes: Partial<DesignLayer>, remember = true) {\n    const next = layers.map((layer) => layer.id === layerId ? { ...layer, ...changes } : layer);\n    if (remember) checkpoint(next); else setLayers(next);\n  }\n  function addLayer(layer: DesignLayer) {\n    checkpoint([...layers, layer]);\n    setSelectedId(layer.id);\n  }\n',
              '  function updateLayer(layerId: string, changes: Partial<DesignLayer>, remember = true) {\n    const next = layers.map((layer) => layer.id === layerId ? clampLayerToSheet({ ...layer, ...changes }, size) : layer);\n    if (remember) checkpoint(next); else setLayers(next);\n  }\n  function addLayer(layer: DesignLayer) {\n    const safeLayer = clampLayerToSheet(layer, size);\n    checkpoint([...layers, safeLayer]);\n    setSelectedId(safeLayer.id);\n  }\n',
            ),
            (
              '  function drag(event: ReactPointerEvent) {\n    const active = dragRef.current;\n    if (!active) return;\n    const x = Math.max(0, Math.min(size.width, active.x + (event.clientX - active.clientX) * size.width / preview.width));\n    const y = Math.max(0, Math.min(size.height, active.y + (event.clientY - active.clientY) * size.height / preview.height));\n    setLayers((items) => items.map((layer) => layer.id === active.id ? { ...layer, x: snapValue(x), y: snapValue(y) } : layer));\n  }\n',
              '  function drag(event: ReactPointerEvent) {\n    const active = dragRef.current;\n    if (!active) return;\n    const x = active.x + (event.clientX - active.clientX) * size.width / preview.width;\n    const y = active.y + (event.clientY - active.clientY) * size.height / preview.height;\n    setLayers((items) => items.map((layer) => layer.id === active.id ? clampLayerToSheet({ ...layer, x: snapValue(x), y: snapValue(y) }, size) : layer));\n  }\n',
            ),
            (
              '    if (typeof project.customWidth === "number") setCustomWidth(project.customWidth);\n    if (typeof project.customHeight === "number") setCustomHeight(project.customHeight);\n    if (typeof project.copies === "number") setCopies(project.copies);\n',
              '    if (typeof project.customWidth === "number") setCustomWidth(finiteNumber(project.customWidth, 300, 20, 2_000));\n    if (typeof project.customHeight === "number") setCustomHeight(finiteNumber(project.customHeight, 500, 20, 5_000));\n    if (typeof project.copies === "number") setCopies(Math.round(finiteNumber(project.copies, 1, 1, 100)));\n',
            ),
            (
              '    if (typeof project.contourOffset === "number") setContourOffset(project.contourOffset);\n    if (typeof project.machineProfile === "string" && ["Generic SVG", "SignMaster", "VinylMaster", "Print/RIP"].includes(project.machineProfile)) setMachineProfile(project.machineProfile as MachineProfile);\n',
              '    if (typeof project.contourOffset === "number") setContourOffset(finiteNumber(project.contourOffset, 0, 0, 50));\n    if (typeof project.machineProfile === "string" && ["Generic SVG", "HPGL / PLT cutter", "SignMaster", "VinylMaster", "Print/RIP"].includes(project.machineProfile)) setMachineProfile(project.machineProfile as MachineProfile);\n',
            ),
            (
              '  function printDesign() {\n    const printWindow = window.open("", "_blank", "width=900,height=700");\n    if (!printWindow) {\n      window.alert("Allow pop-ups for this site so the production print window can open.");\n      return;\n    }\n    printWindow.document.write(`<!doctype html><html><head><title>${escapeXml(jobName)}</title><style>@page{size:${size.width}mm ${size.height}mm;margin:0}html,body{margin:0;width:${size.width}mm;height:${size.height}mm}svg{display:block;width:100%;height:100%}</style></head><body>${svgDocument()}</body></html>`);\n    printWindow.document.close();\n    printWindow.focus();\n    printWindow.setTimeout(() => printWindow.print(), 250);\n  }\n',
              '  function printDesign() {\n    const printWindow = window.open("", "_blank", "width=900,height=700");\n    if (!printWindow) {\n      window.alert("Allow pop-ups for this site so the production print window can open.");\n      return;\n    }\n    printWindow.document.write(buildPrintDocument({ title: escapeXml(jobName), svg: svgDocument(), widthMm: size.width, heightMm: size.height, copies }));\n    printWindow.document.close();\n  }\n',
            ),
            (
              '      setDeviceMessage("Choose the cutter or printer adapter. This checks that the browser can see the port; production commands remain in your machine software.");\n',
              '      setDeviceMessage("Choose a serial cutter adapter. Standard printers continue through the operating-system print dialog.");\n',
            ),
            (
              '      setDeviceMessage(`Port detected at ${baudRate} baud. This is a connection check, not proof that a production job was sent. Export the prepared file to the selected machine software.`);\n',
              '      setDeviceMessage(`Port detected at ${baudRate} baud. Generic HPGL vector jobs can be sent only after the production checks pass; other workflows use SVG or the system print dialog.`);\n',
            ),
            (
              '  async function disconnectDevice() {\n',
              '''  async function sendHpglJob() {
    const port = portRef.current;
    if (!port?.writable) {
      setDevice("error");
      setDeviceMessage("The selected serial port is not writable. Reconnect the cutter and try again.");
      return;
    }
    const check = checkProductionDesign({ layers, sheet: size, machineProfile, material, mirror, registrationMarks, copies });
    if (check.errors.length) {
      setDevice("error");
      setDeviceMessage(check.errors.join(" "));
      return;
    }
    const writer = port.writable.getWriter();
    try {
      const hpgl = buildHpgl({ layers, sheet: size, mirror, weedBox });
      await writer.write(new TextEncoder().encode(hpgl));
      setDevice("connected");
      setDeviceMessage(`Vector job sent to the open serial port at ${baudRate} baud. Confirm movement and material loading at the cutter before leaving it unattended.`);
    } catch (error) {
      setDevice("error");
      setDeviceMessage(error instanceof Error ? error.message : "The cutter did not accept the serial job.");
    } finally {
      writer.releaseLock();
    }
  }
  async function disconnectDevice() {
''',
            ),
            (
              '  const deviceTone = device === "connected" ? "border-emerald-200 bg-emerald-50" : device === "unsupported" || device === "error" ? "border-amber-200 bg-amber-50" : "border-slate-200 bg-slate-50";\n',
              '  const productionCheck = useMemo(() => checkProductionDesign({ layers, sheet: size, machineProfile, material, mirror, registrationMarks, copies }), [layers, size.width, size.height, machineProfile, material, mirror, registrationMarks, copies]);\n  const productionBlocked = productionCheck.errors.length > 0;\n  const deviceTone = device === "connected" ? "border-emerald-200 bg-emerald-50" : device === "unsupported" || device === "error" ? "border-amber-200 bg-amber-50" : "border-slate-200 bg-slate-50";\n',
            ),
            (
              '<section className="panel p-4"><div className="flex items-center gap-2"><Download size={18} /><h3 className="font-semibold">Production output</h3></div><label className="mt-3 block text-xs font-semibold text-slate-600">Machine workflow<select className="field mt-1" value={machineProfile} onChange={(event) => setMachineProfile(event.target.value as MachineProfile)}><option>Generic SVG</option><option>SignMaster</option><option>VinylMaster</option><option>Print/RIP</option></select></label><div className="mt-3 grid gap-2"><Button onClick={() => download(`${safeName(jobName)}.svg`, svgDocument(), "image/svg+xml")}><Scissors size={16} /> Export for {machineProfile}</Button><Button variant="secondary" onClick={printDesign}><Printer size={16} /> Print through this computer</Button><Button variant="outline" onClick={exportManifest}><MonitorCog size={16} /> Export job manifest</Button></div><p className="mt-3 text-[11px] leading-4 text-slate-500">Printing opens only the production sheet at its real millimetre size and uses the printer installed on this computer. SVG carries the prepared artwork into SignMaster, VinylMaster, RIP, or cutter software; the browser does not claim a job was sent directly.</p></section>',
              '''<section className="panel p-4"><div className="flex items-center gap-2"><Download size={18} /><h3 className="font-semibold">Production output</h3></div><label className="mt-3 block text-xs font-semibold text-slate-600">Machine workflow<select className="field mt-1" value={machineProfile} onChange={(event) => setMachineProfile(event.target.value as MachineProfile)}><option>Generic SVG</option><option>HPGL / PLT cutter</option><option>SignMaster</option><option>VinylMaster</option><option>Print/RIP</option></select></label>{productionCheck.errors.length ? <div className="mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-xs leading-5 text-red-800"><p className="font-semibold">Fix before production</p><ul className="mt-1 list-disc pl-4">{productionCheck.errors.map((issue) => <li key={issue}>{issue}</li>)}</ul></div> : null}{productionCheck.warnings.length ? <div className="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs leading-5 text-amber-900"><p className="font-semibold">Operator checks</p><ul className="mt-1 list-disc pl-4">{productionCheck.warnings.map((issue) => <li key={issue}>{issue}</li>)}</ul></div> : null}<div className="mt-3 grid gap-2"><Button disabled={productionBlocked} onClick={() => download(`${safeName(jobName)}.svg`, svgDocument(), "image/svg+xml")}><Scissors size={16} /> Export for {machineProfile}</Button>{machineProfile === "HPGL / PLT cutter" ? <Button variant="secondary" disabled={productionBlocked || device !== "connected"} onClick={sendHpglJob}><Send size={16} /> Send vector job to cutter</Button> : null}<Button variant="secondary" disabled={productionBlocked} onClick={printDesign}><Printer size={16} /> Print {copies} cop{copies === 1 ? "y" : "ies"} through this computer</Button><Button variant="outline" onClick={exportManifest}><MonitorCog size={16} /> Export job manifest</Button></div><p className="mt-3 text-[11px] leading-4 text-slate-500">System printing uses the printer installed on this computer and creates the selected number of real-size pages. Direct serial sending is deliberately limited to checked HPGL rectangle/circle vector jobs. SVG remains the safe handoff for SignMaster, VinylMaster, RIP and other cutter software.</p></section>''',
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"Expected Design Studio text not found: {old[:120]!r}")
            text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          api = Path("src/app/api/designs/route.ts")
          api_text = api.read_text(encoding="utf-8")
          old = 'machineProfile: z.enum(["Generic SVG", "SignMaster", "VinylMaster", "Print/RIP"]),'
          new = 'machineProfile: z.enum(["Generic SVG", "HPGL / PLT cutter", "SignMaster", "VinylMaster", "Print/RIP"]),'
          if old not in api_text:
            raise SystemExit("Design API machine profile schema not found")
          api.write_text(api_text.replace(old, new, 1), encoding="utf-8")
      - name: Commit Design Studio production fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/design/production-studio.tsx src/app/api/designs/route.ts
          git commit -m "Harden Design Studio production output"
          git push origin HEAD:agent/fix-login-csp-and-design-production

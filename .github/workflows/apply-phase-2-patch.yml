name: Apply Phase 2 modular architecture

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-phase-2-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase-2/modular-system-architecture'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-2/modular-system-architecture

      - name: Reconstruct and verify Phase 2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase-patches/phase-2/{00,01,02,03} > /tmp/phase-2.patch.gz.b64
          base64 --decode /tmp/phase-2.patch.gz.b64 | gzip --decompress > /tmp/phase-2.patch
          echo "de584b9aeaa0d74720e402c7f49d9d80f2394e2c3080d6af57eb48eb3711ef7f  /tmp/phase-2.patch" | sha256sum --check --strict

      - name: Apply and commit Phase 2 release
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --check /tmp/phase-2.patch
          git apply --index /tmp/phase-2.patch
          git rm -r .github/phase-patches/phase-2
          git diff --cached --check
          git config user.name "Eugene Shop Release Bot"
          git config user.email "194670606+Eugene999B@users.noreply.github.com"
          git commit -m "feat: Phase 2 modular business architecture"
          git push origin HEAD:phase-2/modular-system-architecture

name: Apply Release 21 Type Fix

on:
  push:
    branches:
      - agent/release-21-shop-machine-profiles-cut-paths

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-21-shop-machine-profiles-cut-paths
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/design-cut-path.ts")
          text = path.read_text().replace(
            "        const control = lastQuadratic ? { x: current.x * 2 - lastQuadratic.x, y: current.y * 2 - lastQuadratic.y } : current;",
            "        const control: CutPoint = lastQuadratic ? { x: current.x * 2 - lastQuadratic.x, y: current.y * 2 - lastQuadratic.y } : current;",
            1,
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/release21-type-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/design-cut-path.ts .github/workflows/release21-type-fix.yml
          git commit -m "Tighten Release 21 SVG control point typing"
          git push origin HEAD:agent/release-21-shop-machine-profiles-cut-paths

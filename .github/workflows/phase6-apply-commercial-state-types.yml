name: Phase 6 apply commercial state types

on:
  push:
    branches:
      - phase-6/admin-controlled-free-access
    paths:
      - scripts/apply-phase6-commercial-state-types.py
      - .github/workflows/phase6-apply-commercial-state-types.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6/admin-controlled-free-access
          fetch-depth: 0
      - name: Apply exact type fixes
        run: python3 scripts/apply-phase6-commercial-state-types.py
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/subscription-hardening.ts
          git diff --cached --check
          git commit -m "fix(phase6): type administrator grant commercial state"
          git push origin HEAD:phase-6/admin-controlled-free-access

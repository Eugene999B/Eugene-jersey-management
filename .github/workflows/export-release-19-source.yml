name: Export Release 19 Source

on:
  push:
    branches:
      - agent/release-19-design-studio-grouping-history

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload advanced Design Studio source
        uses: actions/upload-artifact@v4
        with:
          name: release-19-source
          path: src/components/design/production-studio-advanced.tsx
          retention-days: 1

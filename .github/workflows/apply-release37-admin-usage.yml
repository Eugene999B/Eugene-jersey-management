name: Apply Release 37 billing usage patch

on:
  push:
    branches:
      - agent/release-37-commercial-launch-hardening
    paths:
      - scripts/apply-release37-admin-usage-patch.mjs
      - .github/workflows/apply-release37-admin-usage.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Release 37 branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-37-commercial-launch-hardening
          fetch-depth: 0

      - name: Apply administrator usage patch
        run: node scripts/apply-release37-admin-usage-patch.mjs

      - name: Commit administrator usage register
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/billing/page.tsx
          if git diff --cached --quiet; then
            echo "Administrator usage register is already applied."
            exit 0
          fi
          git commit -m "feat: show tenant subscription usage in billing register"
          git push origin HEAD:agent/release-37-commercial-launch-hardening

name: Diagnose Release 21 Build

on:
  push:
    branches:
      - agent/release-21-shop-machine-profiles-cut-paths

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sports_shop_platform?schema=public
      SESSION_SECRET: github-actions-validation-secret-at-least-32-characters
      TWO_FACTOR_ENCRYPTION_KEY: github-actions-two-factor-encryption-key-at-least-32-characters
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_PROVIDER: local
      SMS_PROVIDER: console
      WHATSAPP_PROVIDER: console
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_shop_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sports_shop_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-21-shop-machine-profiles-cut-paths
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - name: Capture production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee release21-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-21-build-diagnostics
          path: release21-build.log
          retention-days: 2
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/release21-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release21-export.yml
          git commit -m "Remove Release 21 build diagnostic workflow"
          git push origin HEAD:agent/release-21-shop-machine-profiles-cut-paths
      - name: Preserve build result
        if: always()
        run: exit ${{ steps.build.outputs.exit_code || '1' }}

name: Apply Phase 1 acceptance fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-phase1-acceptance-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase-1/esm-identity-generalization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-1/esm-identity-generalization

      - name: Reconstruct and verify acceptance patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase1-acceptance.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/phase1-acceptance.patch.gz.b64 | gzip --decompress > /tmp/phase1-acceptance.patch
          echo "4bbe687639c1f461ef3f92127c9962daf235f59cc3958267d635d9c4726720a6  /tmp/phase1-acceptance.patch" | sha256sum --check --strict

      - name: Apply and commit acceptance fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --check /tmp/phase1-acceptance.patch
          git apply --index /tmp/phase1-acceptance.patch
          git diff --cached --check
          git config user.name "Eugene Shop Release Bot"
          git config user.email "194670606+Eugene999B@users.noreply.github.com"
          git commit -m "test: align Phase 1 browser acceptance with ESM"
          git push origin HEAD:phase-1/esm-identity-generalization

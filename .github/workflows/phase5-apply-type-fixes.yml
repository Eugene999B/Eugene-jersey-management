name: Phase 5 apply type fixes

on:
  push:
    branches:
      - phase-5/business-onboarding-configuration
    paths:
      - scripts/apply-phase5-type-fixes.py
      - .github/workflows/phase5-apply-type-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5/business-onboarding-configuration
          fetch-depth: 0
      - name: Apply focused Phase 5 fixes
        run: python3 scripts/apply-phase5-type-fixes.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth.ts src/app/dashboard/setup/page.tsx
          git diff --cached --check
          git commit -m "fix(phase5): expose onboarding fields and typed links"
          git push origin HEAD:phase-5/business-onboarding-configuration

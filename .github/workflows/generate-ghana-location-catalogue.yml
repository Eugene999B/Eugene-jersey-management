name: Generate Ghana location catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - agent/release-36-2-offline-ghana-catalogue
    paths:
      - scripts/generate-ghana-location-catalogue.mjs
      - .github/workflows/generate-ghana-location-catalogue.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out catalogue branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-36-2-offline-ghana-catalogue
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download current Ghana GeoNames snapshot
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            https://download.geonames.org/export/dump/GH.zip \
            --output /tmp/GH.zip
          unzip -p /tmp/GH.zip GH.txt > /tmp/GH.txt
          test -s /tmp/GH.txt

      - name: Generate bundled catalogue
        run: node scripts/generate-ghana-location-catalogue.mjs /tmp/GH.txt src/data/ghana-location-catalogue.generated.json

      - name: Commit generated catalogue
        run: |
          if git diff --quiet -- src/data/ghana-location-catalogue.generated.json; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ghana-location-catalogue.generated.json
          git commit -m "data: bundle Ghana districts and towns"
          git push origin HEAD:agent/release-36-2-offline-ghana-catalogue

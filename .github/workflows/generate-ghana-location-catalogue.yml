name: Generate Ghana location catalogue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/generate-ghana-location-catalogue.mjs
      - .github/workflows/generate-ghana-location-catalogue.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download current Ghana GeoNames snapshot
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            https://download.geonames.org/export/dump/GH.zip \
            --output /tmp/GH.zip
          unzip -p /tmp/GH.zip GH.txt > /tmp/GH.txt
          test -s /tmp/GH.txt

      - name: Generate bundled catalogue
        run: node scripts/generate-ghana-location-catalogue.mjs /tmp/GH.txt src/data/ghana-location-catalogue.generated.json

      - name: Upload generated catalogue
        uses: actions/upload-artifact@v4
        with:
          name: ghana-location-catalogue
          path: src/data/ghana-location-catalogue.generated.json
          if-no-files-found: error
          retention-days: 3

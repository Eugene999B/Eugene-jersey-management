name: Fix Phase 2 lint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-phase2-lint.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'phase-2/modular-system-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-2/modular-system-architecture

      - name: Apply focused accessibility correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/shops/[shopId]/page.tsx')
          text = path.read_text()

          old_open = '                <label key={module.key} className={`rounded-xl border p-4 ${available ? enabled ? "border-cyan-300 bg-cyan-50" : "border-slate-200 bg-white" : "border-dashed border-slate-300 bg-slate-50 text-slate-500"}`}>'
          new_open = '                <div key={module.key} className={`rounded-xl border p-4 ${available ? enabled ? "border-cyan-300 bg-cyan-50" : "border-slate-200 bg-white" : "border-dashed border-slate-300 bg-slate-50 text-slate-500"}`}>'
          old_input = '                    {available ? <input type="checkbox" name="enabledModules" value={module.key} defaultChecked={enabled} className="mt-1 h-5 w-5 rounded border-slate-300" /> : <span className="mt-1 grid h-5 w-5 place-items-center rounded border border-slate-300 text-[9px] font-bold">—</span>}'
          new_input = '                    {available ? <input type="checkbox" name="enabledModules" value={module.key} defaultChecked={enabled} aria-label={`Enable ${module.label}`} className="mt-1 h-5 w-5 rounded border-slate-300" /> : <span className="mt-1 grid h-5 w-5 place-items-center rounded border border-slate-300 text-[9px] font-bold">—</span>}'
          old_close = '                  </div>\n                </label>\n              );'
          new_close = '                  </div>\n                </div>\n              );'

          for old in (old_open, old_input, old_close):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match, found {text.count(old)}: {old[:80]}')

          text = text.replace(old_open, new_open).replace(old_input, new_input).replace(old_close, new_close)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/app/admin/shops/'[shopId]'/page.tsx

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git add src/app/admin/shops/'[shopId]'/page.tsx
          git config user.name "Eugene Shop Release Bot"
          git config user.email "194670606+Eugene999B@users.noreply.github.com"
          git commit -m "fix: label administrator module controls accessibly"
          git push origin HEAD:phase-2/modular-system-architecture

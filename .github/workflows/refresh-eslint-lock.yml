name: Refresh ESLint security lockfile

on:
  push:
    branches:
      - agent/full-system-hardening-and-brand
    paths:
      - package.json
      - .github/workflows/refresh-eslint-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-system-hardening-and-brand
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve lockfile and capture diagnostics
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts > lock-refresh.log 2>&1
          exit_code=$?
          echo "$exit_code" > lock-refresh.exit
          cat lock-refresh.log
          exit 0
      - name: Commit result or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          exit_code=$(cat lock-refresh.exit)
          if [ "$exit_code" = "0" ]; then
            rm -f lock-refresh.log lock-refresh.exit
            if git diff --quiet -- package-lock.json; then exit 0; fi
            git add package-lock.json
            git commit -m "Refresh lockfile for direct ESLint plugins"
          else
            mv lock-refresh.log docs/lock-refresh-error.log
            rm -f lock-refresh.exit
            git add docs/lock-refresh-error.log
            git commit -m "Capture ESLint lockfile refresh error"
          fi
          git push origin HEAD:agent/full-system-hardening-and-brand

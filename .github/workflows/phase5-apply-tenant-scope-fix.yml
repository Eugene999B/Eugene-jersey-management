name: Phase 5 apply tenant scope fix

on:
  push:
    branches:
      - phase-5/business-onboarding-configuration
    paths:
      - scripts/apply-phase5-tenant-scope-fix.py
      - .github/workflows/phase5-apply-tenant-scope-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5/business-onboarding-configuration
          fetch-depth: 0
      - name: Apply tenant-scoped location access
        run: python3 scripts/apply-phase5-tenant-scope-fix.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tenant-db.ts src/app/dashboard/setup/actions.ts src/app/dashboard/setup/page.tsx
          git diff --cached --check
          git commit -m "fix(phase5): keep onboarding location tenant scoped"
          git push origin HEAD:phase-5/business-onboarding-configuration

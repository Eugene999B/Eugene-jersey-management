name: Verify Railway Staging Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CI: "true"
      E2E_EXTERNAL: "true"
      E2E_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_ADMIN_LOGIN_ID: ${{ secrets.STAGING_ADMIN_LOGIN_ID }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}

    steps:
      - name: Validate protected staging target and credentials
        shell: bash
        run: |
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "GitHub staging variable STAGING_BASE_URL must contain the Railway staging https:// URL."; exit 1 ;;
          esac
          test -n "$STAGING_ADMIN_LOGIN_ID" || { echo "STAGING_ADMIN_LOGIN_ID is required in the GitHub staging environment."; exit 1; }
          test -n "$STAGING_ADMIN_PASSWORD" || { echo "STAGING_ADMIN_PASSWORD is required in the GitHub staging environment."; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        run: npm --prefix e2e ci

      - name: Audit browser test dependencies
        run: npm --prefix e2e audit --audit-level=high

      - name: Install Chromium
        run: npm --prefix e2e run install:chromium

      - name: Run external staging release acceptance
        shell: bash
        run: |
          set +e
          cd e2e
          npx playwright test tests/phase17-staging-release-smoke.spec.ts 2>&1 | tee ../staging-e2e.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-staging-acceptance
          path: |
            staging-e2e.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

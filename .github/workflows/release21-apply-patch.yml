name: Apply Release 21 Integration Patch

on:
  push:
    branches:
      - agent/release-21-shop-machine-profiles-cut-paths

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-21-shop-machine-profiles-cut-paths
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply machine profile and cut-path integration
        shell: bash
        env:
          PATCH_PAYLOAD: 
        run: |
          python - <<'PY'
          import base64, os, zlib
          source = zlib.decompress(base64.b64decode(os.environ["PATCH_PAYLOAD"])).decode()
          exec(compile(source, "release21-patch", "exec"))
          PY
          rm -f .github/workflows/release21-source-export.yml
          rm -f .github/workflows/release21-apply-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/lib/tenant-db.ts scripts/verify-tenant-isolation.ts src/components/design/production-studio-advanced.tsx src/lib/design-cut-path.ts src/app/api/design-machine-profiles/route.ts src/components/design/machine-profile-panel.tsx scripts/seed-e2e.ts .github/workflows
          git commit -m "Integrate shop machine profiles and cut-path production"
          git push origin HEAD:agent/release-21-shop-machine-profiles-cut-paths

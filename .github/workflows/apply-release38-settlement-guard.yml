name: Apply Release 38 settlement guard

on:
  push:
    branches:
      - agent/release-38-subscription-billing-operations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-38-subscription-billing-operations
          fetch-depth: 0
      - name: Format guarded settlement changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/subscription-billing.ts")
          text = path.read_text()

          malformed_paid = '''    if (attempt.invoice.status === SubscriptionInvoiceStatus.PAID) {
              return fail("invoice-already-paid", "Payment arrived after this invoice was already settled. Refund or manual reconciliation is required.");
            }

            if (attempt.invoice.status === SubscriptionInvoiceStatus.VOID)'''
          malformed_paid = malformed_paid.replace("              return", "    return").replace("            }", "  }").replace("            if", "  if")
          formatted_paid = '''    if (attempt.invoice.status === SubscriptionInvoiceStatus.PAID) {
      return fail(
        "invoice-already-paid",
        "Payment arrived after this invoice was already settled. Refund or manual reconciliation is required.",
      );
    }

    if (attempt.invoice.status === SubscriptionInvoiceStatus.VOID)'''
          if malformed_paid in text:
              text = text.replace(malformed_paid, formatted_paid, 1)

          malformed_manual = '''    await tx.subscriptionPaymentAttempt.updateMany({
    where: { invoiceId: invoice.id, status: PaymentStatus.PENDING },
    data: {
      status: PaymentStatus.FAILED,
      failedAt: new Date(),
      gatewayResponse: "Invoice settled manually. Any later provider debit requires refund or reconciliation.",
    },
  });

  await tx.subscriptionPaymentAttempt.create({'''
          formatted_manual = '''    await tx.subscriptionPaymentAttempt.updateMany({
      where: { invoiceId: invoice.id, status: PaymentStatus.PENDING },
      data: {
        status: PaymentStatus.FAILED,
        failedAt: new Date(),
        gatewayResponse: "Invoice settled manually. Any later provider debit requires refund or reconciliation.",
      },
    });

    await tx.subscriptionPaymentAttempt.create({'''
          if malformed_manual in text:
              text = text.replace(malformed_manual, formatted_manual, 1)

          if "Payment arrived after this invoice was already settled" not in text:
              raise SystemExit("paid-invoice settlement guard missing")
          if "Invoice settled manually. Any later provider debit requires refund or reconciliation." not in text:
              raise SystemExit("manual settlement pending-attempt guard missing")

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Settlement guard is already formatted."
            exit 0
          fi
          git config user.name "EJM Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/subscription-billing.ts
          git commit -m "style: format subscription settlement safeguards"
          git push origin HEAD:agent/release-38-subscription-billing-operations

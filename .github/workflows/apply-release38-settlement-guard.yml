name: Apply Release 38 settlement guard

on:
  push:
    branches:
      - agent/release-38-subscription-billing-operations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-38-subscription-billing-operations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned formatter
        run: npm ci --ignore-scripts
      - name: Format guarded settlement changes
        run: npx --no-install biome format --write src/lib/subscription-billing.ts
      - name: Verify settlement guards remain present
        run: |
          grep -F "Payment arrived after this invoice was already settled" src/lib/subscription-billing.ts
          grep -F "Invoice settled manually. Any later provider debit requires refund or reconciliation." src/lib/subscription-billing.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Settlement guard is already formatted."
            exit 0
          fi
          git config user.name "EJM Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/subscription-billing.ts
          git commit -m "style: format subscription settlement safeguards"
          git push origin HEAD:agent/release-38-subscription-billing-operations

name: Apply Release 38 settlement guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/release-38-subscription-billing-operations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-38-subscription-billing-operations
          fetch-depth: 0
      - name: Execute final safeguard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-release38-final-safeguards.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'release38-final-safeguards', 'exec'))
          PY
      - name: Remove one-time workflows
        run: |
          git rm --ignore-unmatch .github/workflows/apply-release38-settlement-guard.yml
          git rm --ignore-unmatch .github/workflows/apply-release38-final-safeguards.yml
      - name: Commit safeguards
        run: |
          git config user.name "EJM Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: guard subscription renewal settlement"
          git push origin HEAD:agent/release-38-subscription-billing-operations

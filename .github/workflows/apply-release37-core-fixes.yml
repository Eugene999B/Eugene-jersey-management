name: Apply Release 37 core fixes

on:
  push:
    branches:
      - agent/release-37-commercial-launch-hardening
    paths:
      - scripts/apply-release37-core-fixes.mjs
      - .github/workflows/apply-release37-core-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Release 37 branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-37-commercial-launch-hardening
          fetch-depth: 0

      - name: Apply core commercial fixes
        run: node scripts/apply-release37-core-fixes.mjs

      - name: Commit core commercial fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/subscription-hardening.ts src/lib/subscription-entitlements.ts src/app/admin/billing/actions.ts src/app/admin/billing/page.tsx
          if git diff --cached --quiet; then
            echo "Core commercial fixes are already applied."
            exit 0
          fi
          git commit -m "fix: close subscription lifecycle bypasses"
          git push origin HEAD:agent/release-37-commercial-launch-hardening

name: Phase 6 apply safety fixes

on:
  push:
    branches:
      - phase-6/admin-controlled-free-access
    paths:
      - scripts/apply-phase6-safety-fixes.py
      - .github/workflows/phase6-apply-safety-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6/admin-controlled-free-access
          fetch-depth: 0
      - name: Apply Phase 6 safety corrections
        run: python3 scripts/apply-phase6-safety-fixes.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/access/actions.ts src/app/admin/access/page.tsx src/tests/phase6-admin-access.test.ts
          git diff --cached --check
          git commit -m "fix(phase6): make access grants fail closed"
          git push origin HEAD:phase-6/admin-controlled-free-access

name: Phase 6 apply access test identity

on:
  push:
    branches:
      - phase-6/admin-controlled-free-access
    paths:
      - scripts/apply-phase6-access-test-identity.py
      - .github/workflows/phase6-apply-access-test-identity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6/admin-controlled-free-access
          fetch-depth: 0
      - name: Add isolated billing administrator
        run: python3 scripts/apply-phase6-access-test-identity.py
      - name: Commit generated seed change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed-e2e.ts
          git diff --cached --check
          git commit -m "test(phase6): seed isolated billing administrator"
          git push origin HEAD:phase-6/admin-controlled-free-access

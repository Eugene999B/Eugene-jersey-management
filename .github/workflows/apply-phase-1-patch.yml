name: Apply Phase 1 ESM release

on:
  push:
    branches:
      - phase-1/esm-identity-generalization
    paths:
      - .github/workflows/apply-phase-1-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase-patches/phase-1/{00,01,02,03,04,05,06,07} > /tmp/phase-1.patch.gz.b64
          base64 --decode /tmp/phase-1.patch.gz.b64 | gzip --decompress > /tmp/phase-1.patch
          echo "8b46f163de620cee7aa0dfdce86030e67dea9fe3c62630b9d06148c297484280  /tmp/phase-1.patch" | sha256sum --check --strict

      - name: Apply Phase 1 release
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --check /tmp/phase-1.patch
          git apply --index /tmp/phase-1.patch
          git rm -r .github/phase-patches/phase-1
          git diff --cached --check

      - name: Commit Phase 1 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eugene Shop Release Bot"
          git config user.email "194670606+Eugene999B@users.noreply.github.com"
          git commit -m "feat: Phase 1 rename and generalize Eugene Shop Management"
          git push origin HEAD:phase-1/esm-identity-generalization

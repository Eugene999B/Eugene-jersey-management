name: Phase 7 apply E2E seed

on:
  push:
    branches:
      - phase-7/generic-catalogue-exact-options
    paths:
      - scripts/apply-phase7-e2e-seed.py
      - .github/workflows/phase7-apply-e2e-seed.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-7/generic-catalogue-exact-options
          fetch-depth: 0
      - name: Apply Phase 7 disposable catalogue seed
        run: python3 scripts/apply-phase7-e2e-seed.py
      - name: Commit generated seed change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed-e2e.ts
          git diff --cached --check
          git commit -m "test(phase7): seed exact-option catalogue journey"
          git push origin HEAD:phase-7/generic-catalogue-exact-options

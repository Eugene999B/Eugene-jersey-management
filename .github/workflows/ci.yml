name: Validate Eugene Jersey Management

on:
  pull_request:

concurrency:
  group: ejm-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply exact compiler corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/design/cutter-operations-console.tsx')
          text = path.read_text()
          replacements = {
            'import type { MachineJobStatus } from "@/lib/machine-production-jobs";': 'import type { MachineJobStatus } from "@/lib/design-machine-operations";',
            '    const port = portRef.current;\n    if (deviceState !== "connected" || !port?.writable) {': '    const port = portRef.current;\n    const writable = port?.writable;\n    if (deviceState !== "connected" || !writable) {',
            '        const writer = port.writable.getWriter();': '        const writer = writable.getWriter();',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected source text not found: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit exact compiler corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/design/cutter-operations-console.tsx
          git commit -m "fix(phase10): preserve client-safe types and serial writer narrowing"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

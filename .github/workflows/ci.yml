name: Validate Eugene Jersey Management

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

concurrency:
  group: ejm-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_shop_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sports_shop_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sports_shop_platform?schema=public
      SESSION_SECRET: github-actions-validation-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_PROVIDER: local
      SMS_PROVIDER: console
      WHATSAPP_PROVIDER: console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          exit_code=$?
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
          exit "$exit_code"

      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-diagnostics
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Reject retired demo credentials
        shell: bash
        run: |
          forbidden='Ghana''123'
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' "$forbidden" .; then
            echo "A retired demo credential was found in the repository."
            exit 1
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Validate guarded demo purge
        env:
          NODE_ENV: test
          SEED_DEMO_PASSWORD: ci-demo-password-2026
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_LOGIN_ID: EJM-CI-ADMIN
          ADMIN_NAME: CI Platform Admin
          ADMIN_PASSWORD: ci-admin-password-2026
          ADMIN_FORCE_RESET: "false"
          PURGE_DEMO_DATA: PURGE-ACC-PRO-DEMO-2026
          PURGE_DEMO_ALLOW_NON_PRODUCTION: "true"
        run: |
          npm run db:seed:demo
          npm run production:activate
          npm run production:purge-demo

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Type-check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test Paystack helpers
        run: npx vitest run src/tests/payments.test.ts

      - name: Test role permissions
        run: npx vitest run src/tests/rbac.test.ts

      - name: Test dashboard access
        run: npx vitest run src/tests/dashboard-access.test.ts

      - name: Test document exports
        run: npx vitest run src/tests/table-export.test.ts

      - name: Test security foundations
        run: npx vitest run src/tests/security-foundation.test.ts

      - name: Generate documentation
        run: npm run docs:generate

      - name: Build
        run: npm run build

name: Validate Eugene Jersey Management

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

concurrency:
  group: ejm-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_shop_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sports_shop_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sports_shop_platform?schema=public
      SESSION_SECRET: github-actions-validation-secret-at-least-32-characters
      TWO_FACTOR_ENCRYPTION_KEY: github-actions-two-factor-encryption-key-at-least-32-characters
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_PROVIDER: local
      SMS_PROVIDER: console
      WHATSAPP_PROVIDER: console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply reviewed Release 25 patch
        if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' && hashFiles('.github/release25-patch/00.txt') != '' }}
        shell: bash
        run: |
          cat .github/release25-patch/*.txt | base64 -d | gzip -d > /tmp/release-25.patch
          git apply --check /tmp/release-25.patch
          git apply /tmp/release-25.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/source/10_System_Diagnostic_Progress_and_Roadmap.md \
            docs/source/20_CEO_Settings_and_Platform_Governance.md \
            docs/source/21_Subscription_Plans_and_Commercial_Approval.md \
            docs/source/22_Communication_Credits_and_Wallets.md \
            docs/source/25_Release_25_Implementation_Checklist.md \
            e2e/tests/communication-credits.spec.ts \
            e2e/tests/solo-admin-help.spec.ts \
            e2e/tests/subscription-plans.spec.ts \
            prisma/migrations/20260728213000_shop_owner_login_ids/migration.sql \
            src/app/admin/billing/actions.ts \
            src/app/admin/billing/communication-actions.ts \
            src/app/admin/billing/communications/page.tsx \
            src/app/admin/billing/page.tsx \
            src/app/admin/create-shop-action.ts \
            src/app/admin/help/page.tsx \
            src/app/admin/layout.tsx \
            src/app/admin/page.tsx \
            'src/app/admin/shops/[shopId]/legal-document/page.tsx' \
            'src/app/admin/shops/[shopId]/page.tsx' \
            src/app/admin/shops/new/page.tsx \
            src/app/admin/shops/page.tsx \
            'src/app/api/guides/[guide]/route.ts' \
            src/app/api/pos/checkout/route.ts \
            src/app/dashboard/debts/page.tsx \
            src/app/dashboard/designs/page.tsx \
            src/app/dashboard/messages/page.tsx \
            src/app/dashboard/pos/page.tsx \
            src/app/dashboard/settings/actions.ts \
            src/app/dashboard/settings/page.tsx \
            src/app/dashboard/staff/page.tsx \
            src/components/admin/admin-navigation.tsx \
            src/components/admin/admin-page-help.tsx \
            src/components/auth/copy-login-id-button.tsx \
            src/components/dashboard/topbar.tsx \
            src/components/pos/pos-terminal.tsx \
            src/lib/auth.ts \
            src/lib/operator-guides.ts \
            src/lib/subscription-plans.ts \
            src/tests/communication-credits.test.ts \
            src/tests/operator-guides.test.ts \
            src/tests/solo-admin-usability-architecture.test.ts \
            src/tests/subscription-plans.test.ts
          git commit -m "Implement sole-admin controls and operator help"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          exit_code=$?
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
          exit "$exit_code"

      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-diagnostics
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Reject retired demo credentials
        shell: bash
        run: |
          forbidden='Ghana''123'
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' "$forbidden" .; then
            echo "A retired demo credential was found in the repository."
            exit 1
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Validate guarded demo purge
        env:
          NODE_ENV: test
          SEED_DEMO_PASSWORD: ci-demo-password-2026
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_LOGIN_ID: EJM-CI-ADMIN
          ADMIN_NAME: CI Platform Admin
          ADMIN_PASSWORD: ci-admin-password-2026
          ADMIN_FORCE_RESET: "false"
          PURGE_DEMO_DATA: PURGE-ACC-PRO-DEMO-2026
          PURGE_DEMO_ALLOW_NON_PRODUCTION: "true"
        run: |
          npm run db:seed:demo
          npm run production:activate
          npm run production:purge-demo

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Type-check application
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test complete suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Run two-shop tenant isolation verification
        shell: bash
        env:
          NODE_ENV: test
          TENANT_ISOLATION_TESTING: "true"
        run: |
          set +e
          npm run test:tenant-isolation 2>&1 | tee tenant-isolation.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload tenant isolation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-diagnostics
          path: tenant-isolation.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Generate documentation
        run: npm run docs:generate

      - name: Build production application without browser test dependencies
        run: npm run build

      - name: Install browser test dependencies
        run: npm --prefix e2e ci

      - name: Audit browser test dependencies
        run: npm --prefix e2e audit --audit-level=high

      - name: Install Chromium for browser acceptance
        run: npm --prefix e2e run install:chromium

      - name: Seed browser acceptance identities
        env:
          NODE_ENV: test
          E2E_TESTING: "true"
          E2E_PASSWORD: ci-browser-password-2026
        run: npm run e2e:seed

      - name: Run Chromium browser acceptance
        shell: bash
        env:
          CI: "true"
          E2E_PASSWORD: ci-browser-password-2026
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-acceptance
          path: |
            e2e.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 5

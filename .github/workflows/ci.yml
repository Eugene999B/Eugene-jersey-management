name: Validate Eugene Jersey Management

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

concurrency:
  group: ejm-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_shop_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sports_shop_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sports_shop_platform?schema=public
      SESSION_SECRET: github-actions-validation-secret-at-least-32-characters
      TWO_FACTOR_ENCRYPTION_KEY: github-actions-two-factor-encryption-key-at-least-32-characters
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_PROVIDER: local
      SMS_PROVIDER: console
      WHATSAPP_PROVIDER: console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Verify dependency security policy
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          node scripts/verify-dependency-security.mjs npm-audit.json
          echo "Raw npm audit exit code: ${audit_exit}"

      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-diagnostics
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Reject retired demo credentials
        shell: bash
        run: |
          forbidden='Ghana''123'
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='package-lock.json' "$forbidden" .; then
            echo "A retired demo credential was found in the repository."
            exit 1
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Validate guarded demo purge
        env:
          NODE_ENV: test
          SEED_DEMO_PASSWORD: ci-demo-password-2026
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_LOGIN_ID: EJM-CI-ADMIN
          ADMIN_NAME: CI Platform Admin
          ADMIN_PASSWORD: ci-admin-password-2026
          ADMIN_FORCE_RESET: "false"
          PURGE_DEMO_DATA: PURGE-ACC-PRO-DEMO-2026
          PURGE_DEMO_ALLOW_NON_PRODUCTION: "true"
        run: |
          npm run db:seed:demo
          npm run production:activate
          npm run production:purge-demo

      - name: Verify staging pre-deploy path
        env:
          NODE_ENV: test
          CI: "true"
          RAILWAY_ENVIRONMENT_NAME: staging
        run: npm run deployment:predeploy

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Type-check application
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Test complete suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Run two-shop tenant isolation verification
        shell: bash
        env:
          NODE_ENV: test
          TENANT_ISOLATION_TESTING: "true"
        run: |
          set +e
          npm run test:tenant-isolation 2>&1 | tee tenant-isolation.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload tenant isolation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-diagnostics
          path: tenant-isolation.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Rehearse migrated database backup and rollback restore
        shell: bash
        env:
          NODE_ENV: test
          PHASE17_RELEASE_REHEARSAL: "true"
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          exec > >(tee phase17-release-rehearsal.log) 2>&1
          pg_dump --version
          npx prisma migrate status
          npx tsx scripts/phase17-release-rehearsal.ts seed
          npx tsx scripts/phase17-release-rehearsal.ts capture phase17-release-fingerprint.json
          pg_dump "postgresql://postgres:postgres@localhost:5432/sports_shop_platform" --format=custom --no-owner --no-privileges --file=phase17-release-backup.dump
          dropdb --if-exists --host=localhost --username=postgres phase17_restore
          createdb --host=localhost --username=postgres phase17_restore
          pg_restore --dbname="postgresql://postgres:postgres@localhost:5432/phase17_restore" --no-owner --no-privileges phase17-release-backup.dump
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/phase17_restore?schema=public" npx prisma migrate status
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/phase17_restore?schema=public" npx tsx scripts/phase17-release-rehearsal.ts verify phase17-release-fingerprint.json
          dropdb --host=localhost --username=postgres phase17_restore

      - name: Upload Phase 17 release rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-release-rehearsal
          path: |
            phase17-release-rehearsal.log
            phase17-release-fingerprint.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate documentation
        run: npm run docs:generate

      - name: Build production application without browser test dependencies
        run: npm run build

      - name: Verify standalone runtime dependencies
        run: node scripts/verify-standalone-runtime-dependencies.mjs

      - name: Install browser test dependencies
        run: npm --prefix e2e ci

      - name: Audit browser test dependencies
        run: npm --prefix e2e audit --audit-level=high

      - name: Install Chromium for browser acceptance
        run: npm --prefix e2e run install:chromium

      - name: Seed browser acceptance identities
        env:
          NODE_ENV: test
          E2E_TESTING: "true"
          E2E_PASSWORD: ci-browser-password-2026
        run: npm run e2e:seed

      - name: Rehearse PostgreSQL backup and restore
        env:
          NODE_ENV: test
          CI: "true"
          RECOVERY_REHEARSAL: "true"
        run: npm run release:verify-recovery

      - name: Run Chromium browser acceptance
        shell: bash
        env:
          CI: "true"
          E2E_TESTING: "true"
          E2E_PASSWORD: ci-browser-password-2026
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          exit_code=${PIPESTATUS[0]}
          exit "$exit_code"

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-acceptance
          path: |
            e2e.log
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 5

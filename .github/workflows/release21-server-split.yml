name: Apply Release 21 Client Server Split

on:
  push:
    branches:
      - agent/release-21-shop-machine-profiles-cut-paths

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-21-shop-machine-profiles-cut-paths
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Split client-safe and server-only machine profile modules
        shell: bash
        run: |
          cat > src/lib/design-machine-profile.ts <<'EOF'
          import type { ProductionMachineProfile } from "@/lib/design-production";

          export const MACHINE_OUTPUT_FORMATS = ["SVG_CUT", "HPGL", "DXF", "PRINT_RIP"] as const;
          export const MACHINE_ORIGINS = ["BOTTOM_LEFT", "TOP_LEFT"] as const;

          export type MachineOutputFormat = (typeof MACHINE_OUTPUT_FORMATS)[number];
          export type MachineOrigin = (typeof MACHINE_ORIGINS)[number];

          export type DesignMachineProfile = {
            id: string;
            name: string;
            outputFormat: MachineOutputFormat;
            bedWidthMm: number;
            bedHeightMm: number;
            unitsPerMm: number;
            baudRate: number;
            origin: MachineOrigin;
            mirrorDefault: boolean;
            isDefault: boolean;
            isActive: boolean;
          };

          export const DEFAULT_MACHINE_PROFILE_INPUT = {
            name: "Generic SVG cutter",
            outputFormat: "SVG_CUT" as const,
            bedWidthMm: 305,
            bedHeightMm: 508,
            unitsPerMm: 40,
            baudRate: 9600,
            origin: "BOTTOM_LEFT" as const,
            mirrorDefault: true,
            isDefault: true,
            isActive: true,
          };

          export function normalizeMachineOutputFormat(value: unknown): MachineOutputFormat {
            return typeof value === "string" && MACHINE_OUTPUT_FORMATS.includes(value as MachineOutputFormat)
              ? value as MachineOutputFormat
              : "SVG_CUT";
          }

          export function normalizeMachineOrigin(value: unknown): MachineOrigin {
            return typeof value === "string" && MACHINE_ORIGINS.includes(value as MachineOrigin)
              ? value as MachineOrigin
              : "BOTTOM_LEFT";
          }

          export function productionWorkflowForProfile(profile: Pick<DesignMachineProfile, "outputFormat">): ProductionMachineProfile {
            if (profile.outputFormat === "HPGL") return "HPGL / PLT cutter";
            if (profile.outputFormat === "PRINT_RIP") return "Print/RIP";
            if (profile.outputFormat === "DXF") return "VinylMaster";
            return "Generic SVG";
          }
          EOF

          cat > src/lib/design-machine-profile-server.ts <<'EOF'
          import "server-only";
          import type { ShopMachineProfile } from "@prisma/client";
          import {
            DEFAULT_MACHINE_PROFILE_INPUT,
            normalizeMachineOrigin,
            normalizeMachineOutputFormat,
            type DesignMachineProfile,
          } from "@/lib/design-machine-profile";
          import { prisma } from "@/lib/db";

          export function serializeMachineProfile(profile: ShopMachineProfile): DesignMachineProfile {
            return {
              id: profile.id,
              name: profile.name,
              outputFormat: normalizeMachineOutputFormat(profile.outputFormat),
              bedWidthMm: profile.bedWidthMm,
              bedHeightMm: profile.bedHeightMm,
              unitsPerMm: profile.unitsPerMm,
              baudRate: profile.baudRate,
              origin: normalizeMachineOrigin(profile.origin),
              mirrorDefault: profile.mirrorDefault,
              isDefault: profile.isDefault,
              isActive: profile.isActive,
            };
          }

          export async function ensureShopMachineProfiles(shopId: string) {
            const existing = await prisma.shopMachineProfile.findMany({
              where: { shopId },
              orderBy: [{ isDefault: "desc" }, { name: "asc" }],
            });
            if (existing.length) return existing.map(serializeMachineProfile);

            try {
              await prisma.shopMachineProfile.create({
                data: { shopId, ...DEFAULT_MACHINE_PROFILE_INPUT },
              });
            } catch {
              // A concurrent first visit may have created the default already.
            }

            return (await prisma.shopMachineProfile.findMany({
              where: { shopId },
              orderBy: [{ isDefault: "desc" }, { name: "asc" }],
            })).map(serializeMachineProfile);
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          page = Path("src/app/dashboard/designs/page.tsx")
          text = page.read_text()
          text = text.replace('import { ensureShopMachineProfiles } from "@/lib/design-machine-profile";', 'import { ensureShopMachineProfiles } from "@/lib/design-machine-profile-server";')
          page.write_text(text)

          route = Path("src/app/api/design-machine-profiles/route.ts")
          text = route.read_text()
          text = text.replace(
            'import {\n  ensureShopMachineProfiles,\n  MACHINE_ORIGINS,\n  MACHINE_OUTPUT_FORMATS,\n  serializeMachineProfile,\n} from "@/lib/design-machine-profile";',
            'import { MACHINE_ORIGINS, MACHINE_OUTPUT_FORMATS } from "@/lib/design-machine-profile";\nimport { ensureShopMachineProfiles, serializeMachineProfile } from "@/lib/design-machine-profile-server";',
          )
          route.write_text(text)

          designs = Path("src/app/api/designs/route.ts")
          text = designs.read_text().replace(
            'import { ensureShopMachineProfiles, serializeMachineProfile } from "@/lib/design-machine-profile";',
            'import { ensureShopMachineProfiles, serializeMachineProfile } from "@/lib/design-machine-profile-server";',
          )
          designs.write_text(text)
          PY

          rm -f .github/workflows/release21-server-split.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/design-machine-profile.ts src/lib/design-machine-profile-server.ts src/app/dashboard/designs/page.tsx src/app/api/design-machine-profiles/route.ts src/app/api/designs/route.ts .github/workflows/release21-server-split.yml
          git commit -m "Keep machine profile database code out of the client bundle"
          git push origin HEAD:agent/release-21-shop-machine-profiles-cut-paths
